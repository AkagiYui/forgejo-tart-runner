name: sync-and-release

# Keeps the tart fork in step with upstream forgejo/runner WITHOUT a permanent
# branch: it rebases our patch series (plan-b/*.patch) onto the latest upstream
# release tag, builds + tests on Apple Silicon, and publishes a Release.
#
# Auto when the patches apply cleanly; on a `git am` conflict (upstream touched
# the same code) or a build/test failure, it opens an issue for manual refresh.
on:
  schedule:
    - cron: '0 6 * * *'        # daily
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (blank = latest stable)'
        required: false
      force:
        description: 'Rebuild even if the release already exists'
        type: boolean
        default: false

permissions:
  contents: write   # create releases
  issues: write     # open an issue when a sync needs manual attention

jobs:
  build:
    runs-on: macos-15          # Apple Silicon: native darwin/arm64 build + tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # There is no go.mod in this repo -- the module lives in the upstream
          # checkout that build.sh creates later -- so setup-go has nothing to
          # key a cache on and only emits a warning. Turn it off.
          cache: false

      - name: Resolve upstream release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git ls-remote --tags --refs https://code.forgejo.org/forgejo/runner 'v*' \
              | awk -F/ '{print $NF}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
          fi
          [ -n "$TAG" ] || { echo "could not resolve upstream tag" >&2; exit 1; }
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "release=${TAG}-tart" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream tag: $TAG -> release ${TAG}-tart"

      - name: Skip if already released
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" != "true" ] && gh release view "${{ steps.tag.outputs.release }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.tag.outputs.release }} exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (rebase patches onto tag)
        if: steps.gate.outputs.build == 'true'
        run: ./plan-b/build.sh "${{ steps.tag.outputs.tag }}"

      - name: Test
        if: steps.gate.outputs.build == 'true'
        working-directory: plan-b/.build
        run: |
          GOTOOLCHAIN=local go vet ./internal/pkg/labels/... ./internal/pkg/config/... ./act/container/...
          GOTOOLCHAIN=local go test ./internal/pkg/labels/... ./internal/pkg/config/...
          # Only our own container tests: the upstream ones in that package want a
          # docker daemon, which a macOS runner does not have.
          GOTOOLCHAIN=local go test ./act/container/ -run 'Tart' -v

      # Exercises the binary that is about to be published. A real macOS VM
      # cannot be booted here -- GitHub's arm64 runners are themselves M1 VMs
      # and Apple's Virtualization.framework has no nested virtualization
      # (actions/runner-images#13505) -- so these checks stop right at the point
      # where the runner would shell out to `tart`. Everything before that point
      # (label scheme, platform string, backend dispatch, image parsing, VM
      # naming, executor wiring) is covered.
      - name: Smoke-test the built binary
        if: steps.gate.outputs.build == 'true'
        env:
          BIN: ${{ github.workspace }}/dist/forgejo-runner-tart
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ghcr.io/cirruslabs/macos-tahoe-base:latest
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/smoke"
          rm -rf "$work"
          mkdir -p "$work"

          # macOS has no `timeout`; perl's alarm survives exec and does the job.
          run_capped() { perl -e 'alarm shift; exec @ARGV' "$@"; }

          # The dispatch check below asserts on the failure to launch tart, so a
          # runner image that ships tart would silently change what is tested.
          if command -v tart >/dev/null 2>&1; then
            echo "tart is installed on this runner; the smoke test assumes it is not" >&2
            exit 1
          fi

          echo "::group::version"
          "$BIN" --version | tee "$work/version.txt"
          grep -qF "${TAG#v}-tart" "$work/version.txt"
          echo "::endgroup::"

          echo "::group::generate-config"
          "$BIN" generate-config > "$work/generated.yml"
          test -s "$work/generated.yml"
          echo "::endgroup::"

          # A tart label has to survive config validation. Upstream v13.1.0 added
          # config.validateLabelScheme(), which rejected the `tart` scheme while
          # everything still compiled and every unit test still passed -- exactly
          # the failure this check exists to catch. The daemon is pointed at a
          # dead port so it fails on the connection, long after the config has
          # been accepted.
          echo "::group::daemon accepts a tart label"
          cat > "$work/tart.yml" <<YAML
          server:
            connections:
              smoke:
                url: http://127.0.0.1:1/
                uuid: c9e50be9-a7c3-4aee-ba35-624c4ff8c519
                token: 6634bb58be0db23cc013a2e72dd1828ae0257cf
                labels:
                  - macos:tart://$IMAGE
          YAML
          run_capped 60 "$BIN" daemon -c "$work/tart.yml" > "$work/daemon.log" 2>&1 || true
          cat "$work/daemon.log"
          grep -q "Starting runner daemon" "$work/daemon.log"
          ! grep -qi "unknown scheme" "$work/daemon.log"
          ! grep -qi "invalid configuration" "$work/daemon.log"
          echo "::endgroup::"

          # End-to-end dispatch, minus the VM: a `tart:` platform must reach
          # StartTartVM with a clean image reference. The expected failure is the
          # missing tart binary, and the message pins the image string (no stray
          # "//" from PickPlatform) and the per-job VM name prefix.
          echo "::group::tart backend dispatch"
          repo="$work/repo"
          mkdir -p "$repo/.forgejo/workflows"
          git -C "$repo" init -q
          git -C "$repo" -c user.email=ci@local -c user.name=ci commit -q --allow-empty -m init
          cat > "$repo/.forgejo/workflows/smoke.yml" <<'YAML'
          on: [push]
          jobs:
            smoke:
              runs-on: macos
              steps:
                - run: echo hello
          YAML
          cd "$repo"
          run_capped 120 "$BIN" exec -W .forgejo/workflows -i "tart:$IMAGE" > "$work/exec.log" 2>&1 || true
          cat "$work/exec.log"
          grep -qF "tart clone $IMAGE -> ftr-" "$work/exec.log"
          grep -q 'executable file not found' "$work/exec.log"
          echo "::endgroup::"

      - name: Publish release
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL="${{ steps.tag.outputs.release }}"
          # `force` re-runs an already published tag, so replace the asset
          # instead of failing on an existing release.
          if gh release view "$REL" >/dev/null 2>&1; then
            gh release upload "$REL" dist/forgejo-runner-tart --clobber
          else
            gh release create "$REL" \
              dist/forgejo-runner-tart \
              --title "$REL" \
              --notes "forgejo-runner \`${{ steps.tag.outputs.tag }}\` + tart macOS VM backend, built automatically by sync-and-release."
          fi

      # Only open an issue when the tag was resolved but the build failed
      # (i.e. the patch series no longer applies, a real problem). When tag
      # resolution itself fails (e.g. transient upstream outage/503), no tag
      # output is set: skip silently, the next daily run will retry. Manual
      # (workflow_dispatch) runs never file one: somebody is already watching.
      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule' && steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Auto-sync failed for ${{ steps.tag.outputs.tag }}"
          # Don't spam: only open one issue per failing tag.
          if [ -z "$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[].number')" ]; then
            gh issue create --title "$TITLE" --body \
              "The scheduled sync/release for upstream tag \`${{ steps.tag.outputs.tag }}\` failed.\n\nMost likely the tart patch series in \`plan-b/*.patch\` no longer applies cleanly (upstream changed the execution-backend dispatch or the ExecutionsEnvironment interface). Refresh it:\n\n1. \`git clone --branch ${{ steps.tag.outputs.tag }} https://code.forgejo.org/forgejo/runner /tmp/u && cd /tmp/u\`\n2. \`git am path/to/plan-b/*.patch\` and resolve conflicts (\`git am --continue\`)\n3. \`git format-patch ${{ steps.tag.outputs.tag }} -o <repo>/plan-b\`\n4. commit the refreshed patches and re-run this workflow.\n\nSee the failed run logs for details."
          fi
